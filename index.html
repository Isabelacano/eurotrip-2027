<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="EuroTrip 2027: ruta, itinerario, gastos, reservas y listas para cuatro amigas/os.">
  <title>EuroTrip 2027</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Tipografía gratuita de Google Fonts: Poppins (medium / semibold / bold). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <!-- Leaflet (código abierto, gratuito, sin clave). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#route" aria-label="EuroTrip 2027, inicio"><img class="wordmark__logo" src="assets/logo-badge.svg" width="30" height="30" alt="">EuroTrip<span>2027</span></a>
    <p id="countdown" class="topbar__sub"></p>
    <button id="profile-btn" class="profile-chip" type="button" aria-label="Elegir o editar tu perfil"></button>
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Datos del viaje y ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones principales">
    <a href="#route" data-tab="route">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Ruta</span>
    </a>
    <a href="#itinerary" data-tab="itinerary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4m8-4v4M7.5 13.5h3m-3 3.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Itinerario</span>
    </a>
    <a href="#expenses" data-tab="expenses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10.5h9M4 13.5h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Gastos</span>
    </a>
    <a href="#planning" data-tab="planning">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h17v3.2a1.8 1.8 0 0 0 0 3.6V17h-17v-3.2a1.8 1.8 0 0 0 0-3.6V7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 7.5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="1.6 1.8"/></svg>
      <span>Reservas</span>
    </a>
    <a href="#checklist" data-tab="checklist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 3.5-4M4 15l2 2 3.5-4M13 7.5h7M13 15.5h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Checklist</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:16px">Esta aplicación necesita JavaScript.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/finance.js"></script>
  <script src="js/core/linkinfo.js"></script>
  <script src="js/data/images.js"></script>
  <script src="js/data/places.js"></script>
  <script src="js/data/europe.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/views/route.js"></script>
  <script src="js/views/itinerary.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/planning.js"></script>
  <script src="js/views/checklist.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
